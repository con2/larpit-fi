name: cicd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/con2/larpit-fi

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: psql -c "CREATE DATABASE larpit_test TEMPLATE template0 LOCALE_PROVIDER icu ICU_LOCALE 'fi-FI'" postgresql://postgres:postgres@localhost/postgres
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost/larpit_test

  build:
    # runs-on: blacksmith-2vcpu-ubuntu-2404
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=,format=short
      # Only a push to main publishes images and the registry build cache.
      - uses: docker/bake-action@v7
        with:
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          set: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && '*.cache-to=' || '' }}
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ steps.meta.outputs.version }}

  deploy_production:
    runs-on: qb-arc-runners
    needs:
      - build
      - test
    environment: production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: |
          helm upgrade --install larpit chart \
            --namespace larpit-production \
            -f chart/values-production.yaml \
            --set image.repository=${{ env.IMAGE }} \
            --set image.tag=${{ needs.build.outputs.tag }} \
            --wait --timeout 300s
