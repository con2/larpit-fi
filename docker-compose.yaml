# Local Garage (S3) for header images in development; see README.md, "Header images (optional)".
services:
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  garage:
