apiVersion: apps/v1
kind: Deployment
metadata:
  name: node
  labels:
    {{- include "larpit.labels" . | nindent 4 }}
    component: node
spec:
  # The selector is immutable; it must stay equal to the one of the Deployment this chart adopted
  # from the pre-Helm manifests.
  selector:
    matchLabels:
      stack: larpit
      component: node
  template:
    metadata:
      labels:
        stack: larpit
        component: node
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        {{- include "larpit.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-migrate"
          command: ["sh", "-c", "node src/bin/migrate.mjs migration check && node src/bin/migrate.mjs db migrate"]
          envFrom:
            {{- include "larpit.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.migrate | nindent 12 }}
          securityContext:
            {{- include "larpit.containerSecurityContext" . | nindent 12 }}
          # The migrate image has no Next.js cache; the mount stays because server-side apply
          # keeps this list item under its pre-Helm owner and rejects the Deployment without it.
          volumeMounts:
            - name: next-cache
              mountPath: /usr/src/app/.next/cache
      containers:
        - name: node
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          envFrom:
            {{- include "larpit.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.node | nindent 12 }}
          securityContext:
            {{- include "larpit.containerSecurityContext" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname | quote }}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname | quote }}
            periodSeconds: 30
          volumeMounts:
            - name: next-cache
              mountPath: /usr/src/app/.next/cache
      volumes:
        - name: next-cache
          emptyDir: {}
