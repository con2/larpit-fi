# Plain HTTP only redirects to HTTPS. Done per app instead of at the Traefik entrypoint so
# cert-manager's HTTP-01 solver Ingress keeps working.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  labels:
    {{- include "larpit.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: larpit
      sectionName: http
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  labels:
    {{- include "larpit.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: larpit
      sectionName: https
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: body-limit
      backendRefs:
        - name: node
          port: 3000
---
# An HTTPRoute can only reference Middlewares in its own namespace, so the cluster-wide
# default/body-1m the Ingress used is repeated here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
  labels:
    {{- include "larpit.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: 1000000
