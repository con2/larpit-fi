# One Gateway per app namespace, attached to the cluster's Traefik GatewayClass. The TLS
# certificate comes from the explicit Certificate below because cert-manager in this cluster runs
# without Gateway API support.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: larpit
  labels:
    {{- include "larpit.labels" . | nindent 4 }}
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "larpit.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: larpit
  labels:
    {{- include "larpit.labels" . | nindent 4 }}
spec:
  secretName: {{ include "larpit.tlsSecretName" . }}
  privateKey:
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - {{ .Values.hostname | quote }}
