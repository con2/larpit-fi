apiVersion: v1
kind: ConfigMap
metadata:
  name: larpit
  labels:
    {{- include "larpit.labels" . | nindent 4 }}
data:
  PORT: "3000"
  AUTH_URL: {{ printf "https://%s" .Values.hostname | quote }}
  NEXT_PUBLIC_KOMPASSI_BASE_URL: {{ .Values.kompassi.baseUrl | quote }}
  SMTP_HOSTNAME: {{ .Values.mail.smtpHostname | quote }}
  SMTP_PORT: {{ .Values.mail.smtpPort | quote }}
  {{- with .Values.s3 }}
  {{- if .bucket }}
  S3_ENDPOINT: {{ .endpoint | quote }}
  {{- with .publicEndpoint }}
  S3_PUBLIC_ENDPOINT: {{ . | quote }}
  {{- end }}
  S3_REGION: {{ .region | quote }}
  S3_BUCKET: {{ .bucket | quote }}
  S3_FORCE_PATH_STYLE: {{ .forcePathStyle | quote }}
  {{- end }}
  {{- end }}
