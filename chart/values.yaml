# Real environment values live in values-production.yaml.
# This file's secret.* fields are obviously-bogus placeholders so `helm template`/`helm lint`
# work without real secrets -- never deploy with these values as-is.

image:
  # Normally supplied by --set at `helm upgrade` time in .github/workflows/cicd.yaml.
  repository: ghcr.io/con2/larpit-fi
  tag: latest

hostname: larpit.example.com

kompassi:
  baseUrl: https://dev.kompassi.eu

mail:
  smtpHostname: sr1.pahaip.fi
  smtpPort: 25

# Hourly CronJob adding PHOTOS links to larps that a Larppikuvat.fi album points to. It writes
# links to production albums, so only production enables it.
larppikuvatSync:
  enabled: false

# S3-compatible storage for header images (the cluster's Garage). An empty bucket turns header
# images off. `endpoint` is what the pods call; `publicEndpoint` is what browsers reach for
# presigned URLs (defaults to `endpoint`). The access keys go in the Secret (S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY). See chart/README.md, "Header images in S3 (Garage)".
s3:
  endpoint: ""
  publicEndpoint: ""
  region: garage
  bucket: ""
  forcePathStyle: true

resources:
  node:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  migrate:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  sync:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# The Next.js server connects through PgBouncer (DATABASE_URL_POOLED in the Secret, transaction
# mode) instead of DATABASE_URL. Its pg.Pool keeps up to 10 connections per process open while
# idle; pooled, those cost the shared database nothing.
databasePooled: false

# THE PRODUCTION-RECOMMENDED PATH: point at a pre-existing Secret with keys
# DATABASE_URL, AUTH_SECRET, KOMPASSI_OIDC_CLIENT_ID, KOMPASSI_OIDC_CLIENT_SECRET (and optionally
# DATABASE_URL_POOLED and DATABASE_URL_REPLICA, and S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY when
# `s3.bucket` is set) and the chart skips creating its own.
existingSecretName: ""
secret:
  databaseUrl: postgresql://changeme:changeme@postgres:5432/changeme
  # The same database through PgBouncer; required when databasePooled is true.
  databasePooledUrl: ""
  # Read replica for public pages and APIs. Empty means every query goes to databaseUrl.
  databaseReplicaUrl: ""
  authSecret: changeme
  kompassiClientId: changeme
  kompassiClientSecret: changeme
  s3AccessKeyId: ""
  s3SecretAccessKey: ""
